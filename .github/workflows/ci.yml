name: ci

on:
  push:
    branches: [master, main]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    name: go test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: src/go.mod
          cache-dependency-path: src/go.sum

      # Our own sources only: the vendored tree is third-party code and is not
      # all gofmt-clean, nor should it be reformatted.
      - name: gofmt
        run: |
          unformatted=$(find . -name '*.go' -not -path './vendor/*' -exec gofmt -l {} +)
          if [ -n "$unformatted" ]; then
            echo "not gofmt'd:"; echo "$unformatted"; exit 1
          fi

      - name: vet
        run: go vet ./...

      # The suite is deliberately self-contained: no systemd, dbus or network,
      # so it runs anywhere, including in the nix build sandbox.
      - name: test
        run: go test ./...

      - name: build
        run: CGO_ENABLED=0 go build ./...

  nix:
    name: nix build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - run: nix build .
      - run: ./result/bin/unitop -v
