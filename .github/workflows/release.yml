name: release

# Tag a commit to publish binaries:
#   git tag -a v0.1.0 -m 'v0.1.0' && git push origin v0.1.0
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build and publish'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-go@v7
        with:
          go-version-file: src/go.mod
          cache-dependency-path: src/go.sum

      - name: Build static binaries
        working-directory: src
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -eu
          version="${TAG#v}"
          mkdir -p ../dist
          for arch in amd64 arm64; do
            echo "building linux/$arch"
            CGO_ENABLED=0 GOOS=linux GOARCH="$arch" \
              go build -trimpath -ldflags "-s -w -X main.version=$version" \
              -o "../dist/unitop-linux-$arch" .
          done
          cd ../dist
          sha256sum unitop-linux-* > SHA256SUMS
          file unitop-linux-amd64
          cat SHA256SUMS

      # Release notes come from CHANGELOG.md: the section for this version,
      # up to the next heading. Falls back to generated notes if the version
      # has no entry, so a release is never blocked on the changelog.
      - name: Extract release notes
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -eu
          version="${TAG#v}"
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          if [ -s notes.md ]; then
            echo "have_notes=1" >> "$GITHUB_ENV"
            cat notes.md
          else
            echo "no CHANGELOG entry for $version; using generated notes"
          fi

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -eu
          if [ "${have_notes:-}" = "1" ]; then
            notes_arg="--notes-file=notes.md"
          else
            notes_arg="--generate-notes"
          fi
          gh release create "$TAG" \
            --title "$TAG" \
            "$notes_arg" \
            dist/unitop-linux-amd64 \
            dist/unitop-linux-arm64 \
            dist/SHA256SUMS
