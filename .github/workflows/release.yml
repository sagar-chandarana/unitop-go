name: release

# Tag a commit to publish binaries:
#   git tag -a v0.1.0 -m 'v0.1.0' && git push origin v0.1.0
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build and publish'
        required: true

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    # Only this job publishes; scope the write here, not repo-wide.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ inputs.tag || github.ref }}
          fetch-tags: true

      # A workflow_dispatch input is free text: refuse anything that is not an
      # existing v* TAG whose commit is exactly what was checked out, so a
      # branch or a bare SHA cannot be built and published under a tag name.
      - name: Validate the release tag
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -eu
          case "$TAG" in
            v*) ;;
            *) echo "refusing a non-v* release ref: $TAG" >&2; exit 1 ;;
          esac
          want=$(git rev-parse --verify "refs/tags/$TAG^{commit}" 2>/dev/null) || {
            echo "no such tag: $TAG" >&2; exit 1
          }
          if [ "$want" != "$(git rev-parse --verify HEAD)" ]; then
            echo "the checkout is not tag $TAG" >&2; exit 1
          fi

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: src/go.mod
          cache-dependency-path: src/go.sum
          cache: false

      - name: Build static binaries
        working-directory: src
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -eu
          version="${TAG#v}"
          mkdir -p ../dist
          for arch in amd64 arm64; do
            echo "building linux/$arch"
            CGO_ENABLED=0 GOOS=linux GOARCH="$arch" \
              go build -trimpath -ldflags "-s -w -X main.version=$version" \
              -o "../dist/unitop-linux-$arch" .
          done
          cd ../dist
          sha256sum unitop-linux-* > SHA256SUMS
          file unitop-linux-amd64
          cat SHA256SUMS

      # Release notes come from CHANGELOG.md: the section for this version,
      # up to the next heading. Falls back to generated notes if the version
      # has no entry, so a release is never blocked on the changelog.
      - name: Extract release notes
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -eu
          version="${TAG#v}"
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          if [ -s notes.md ]; then
            echo "have_notes=1" >> "$GITHUB_ENV"
            cat notes.md
          else
            echo "no CHANGELOG entry for $version; using generated notes"
          fi

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -eu
          if [ "${have_notes:-}" = "1" ]; then
            notes_arg="--notes-file=notes.md"
          else
            notes_arg="--generate-notes"
          fi
          gh release create "$TAG" \
            --verify-tag \
            --title "$TAG" \
            "$notes_arg" \
            dist/unitop-linux-amd64 \
            dist/unitop-linux-arm64 \
            dist/SHA256SUMS
